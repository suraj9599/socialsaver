
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve prerendered pages.
    location / {
        try_files $uri $uri/ =404;
    }

    # Serve sitemap and robots directly.
    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
    }

    # Cache versioned build assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Prevent missing routes from returning homepage HTML.
    error_page 404 /404.html;
}
